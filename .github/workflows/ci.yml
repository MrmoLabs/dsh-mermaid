name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit bundled and test dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Run checks
        run: npm run check

      - name: Install headless Chromium
        run: node node_modules/playwright-core/cli.js install chromium --only-shell

      - name: Check browser layout regressions
        run: npm run check:browser -- --smoke

      - name: Verify package contents
        run: npm pack --dry-run
