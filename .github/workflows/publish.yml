name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        default: v0.4.3

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.RELEASE_TAG !== expected) { throw new Error('Expected tag ' + expected + ', received ' + process.env.RELEASE_TAG); }"

      - name: Install dependencies
        run: npm ci

      - name: Audit bundled and test dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Run checks
        run: npm run check

      - name: Check npm version
        id: npm_version
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-mermaid@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.npm_version.outputs.exists != 'true'
        run: npm publish --access public

      - name: Build GitHub release archive
        run: npm pack --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          archive="dsh-mermaid-$(node -p "require('./package.json').version").tgz"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          else
            gh release create "$RELEASE_TAG" "$archive" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
